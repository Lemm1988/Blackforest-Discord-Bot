name: Build dumbpipe for Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Clone dumbpipe source
        run: git clone --depth 1 https://github.com/n0-computer/dumbpipe.git dumbpipe-src

      - name: Build dumbpipe for aarch64-linux-android (arm64-v8a)
        working-directory: dumbpipe-src
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -o ../output build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dumbpipe-android-arm64
          path: output/arm64-v8a/dumbpipe
