name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build-dumbpipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Clone dumbpipe source
        run: git clone --depth 1 https://github.com/n0-computer/dumbpipe.git dumbpipe-src

      - name: iroh aktualisieren (Android-DNS-Fallback im Release-Build)
        # KERNURSACHE des "Prozess laeuft, aber keine Verbindung"-Problems:
        # dumbpipes mitgelieferte Cargo.lock nagelt iroh/iroh-dns auf 1.0.0 fest,
        # und `cargo build` respektiert die Lockfile. iroh-dns 1.0.0 faengt den
        # Android-JNI-DNS-Panic NUR in Debug-Builds ab (#[cfg(debug_assertions)]);
        # im Release-Build laeuft der Panic durch -> genau der beobachtete
        # Exit-Code 101. Ab iroh-dns 1.0.2 ist das catch_unwind unbedingt aktiv
        # (Upstream-PR n0-computer/iroh#4371, 25.06.2026, in die 1.0er-Reihe
        # zurueckportiert) und faellt auf Google-DNS (UDP UND TCP) zurueck.
        # Zum Vergleich: `cargo install dumbpipe` ignoriert die Lockfile und
        # zieht deshalb eine neuere iroh-Version - genau dieses Binary
        # funktioniert nachweislich, das aus diesem Workflow bisher nicht.
        #
        # `cargo update -p` (ohne --precise) bleibt bewusst auf der 1.0er-Reihe
        # (-> 1.0.2): kleinstmoegliche Aenderung, die den Fix enthaelt.
        working-directory: dumbpipe-src
        run: |
          cargo update -p iroh -p iroh-dns
          echo "--- iroh-Versionen nach dem Update (muss >= 1.0.2 sein) ---"
          grep -A1 '^name = "iroh"' Cargo.lock
          grep -A1 '^name = "iroh-dns"' Cargo.lock

      - name: Patch dumbpipe's Cargo.toml - panic=abort -> unwind
        # dumbpipes eigenes Cargo.toml setzt [profile.release] panic = "abort".
        # Das macht iroh's eigenes internes catch_unwind fuer den bekannten
        # Android-JNI-DNS-Panic ("android context was not initialized",
        # ndk-context, ausgeloest in hickory_resolver::system_conf::read_system_conf
        # beim Aufbau des DnsResolver) komplett wirkungslos: bei panic=abort wird
        # NIE abgewickelt, der ganze Prozess stirbt sofort, egal wo im Code ein
        # catch_unwind steht. Direkter sed-Patch statt nur CARGO_PROFILE_RELEASE_PANIC
        # env var, da Letzteres allein nicht zuverlaessig genug griff (Exit-Code
        # aenderte sich zwar von 134/SIGABRT auf 101/unabgefangener Panic, aber der
        # Prozess starb weiterhin) - dieser direkte Zeilen-Ersatz ist eindeutig.
        working-directory: dumbpipe-src
        run: |
          echo "--- Vorher ---"
          grep -A5 "\[profile.release\]" Cargo.toml
          sed -i 's/panic = "abort"/panic = "unwind"/' Cargo.toml
          echo "--- Nachher ---"
          grep -A5 "\[profile.release\]" Cargo.toml

      # ENTFERNT: "Patch dumbpipe's Endpoint-Aufbau - Android-JNI-DNS-Lookup weglassen"
      # Das zugehoerige Skript android-app/patch_dumbpipe_android.py wurde mit
      # entfernt; Begruendung und Analyse stehen in
      # docs/Fernzugriff-Setup-Anleitung.md, Abschnitt 9.1.
      #
      # Der Patch ersetzte irohs Standard-Resolver durch
      # DnsResolver::with_nameserver("8.8.8.8:53") - laut iroh-Doku "a new DNS
      # resolver configured with a SINGLE UDP DNS nameserver". Er verhinderte
      # zwar den Panic, ersetzte damit aber irohs getesteten Fallback
      # (ResolverConfig::udp_and_tcp(&GOOGLE): mehrere Server, UDP UND TCP)
      # durch einen einzelnen UDP-Server ohne Ausweichpfad. Ergebnis: Der
      # Prozess lebte, baute aber keine Verbindung mehr auf - kein Fehler,
      # keine Ausgabe, nur Stille.
      #
      # Mit iroh >= 1.0.2 (siehe Update-Schritt oben) ist der Patch unnoetig:
      # iroh faengt den JNI-Panic selbst ab und nutzt seinen eigenen Fallback.
      # Der panic=unwind-Patch oben bleibt zwingend erforderlich, weil genau
      # dieses catch_unwind ohne Unwinding nicht funktionieren kann.

      - name: Build dumbpipe for aarch64-linux-android (arm64-v8a)
        working-directory: dumbpipe-src
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Redundante Absicherung zusaetzlich zum sed-Patch oben.
          CARGO_PROFILE_RELEASE_PANIC: unwind
        run: cargo ndk -t arm64-v8a -o ../output build --release

      - name: Verify binary exists
        run: ls -la dumbpipe-src/target/aarch64-linux-android/release/dumbpipe

      - name: Upload dumbpipe artifact
        uses: actions/upload-artifact@v4
        with:
          name: dumbpipe-android-arm64
          path: dumbpipe-src/target/aarch64-linux-android/release/dumbpipe
          if-no-files-found: error

  build-apk:
    needs: build-dumbpipe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dumbpipe binary
        uses: actions/download-artifact@v4
        with:
          name: dumbpipe-android-arm64
          path: downloaded-binary

      - name: Place binary as jniLibs "shared library"
        run: |
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a
          cp downloaded-binary/dumbpipe android-app/app/src/main/jniLibs/arm64-v8a/libdumbpipe.so
          chmod 755 android-app/app/src/main/jniLibs/arm64-v8a/libdumbpipe.so
          ls -la android-app/app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists
        run: ls -la android-app/app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackforestbot-tunnel-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
